name: Publish Build #12 Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0-build12
      source_sha:
        description: Commit SHA used by Build #12
        required: true
        default: 0653279b4681a2aace5c986aae7e009aaed0f55b

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Build #12 source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ inputs.source_sha }}
          name: Natural Lip-Sync ${{ inputs.tag }}
          body: |
            Natural Lip-Sync Offline Edition — Build #12.

            This release contains the Android APK built from commit `${{ inputs.source_sha }}` with Flutter Android embedding v2 and the maintained FFmpeg 4.6.2 dependency.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
