name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 18}
      - uses: actions/setup-java@v4
        with: {distribution: 'zulu', java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Patch ffmpeg-kit-react-native for Maven Central 2025 fix
        run: |
          sed -i "s/com\.arthenica/dev.ffmpegkit-maintained/g" node_modules/ffmpeg-kit-react-native/android/build.gradle || true
          sed -i "s/:6\.0\-2/:6.0.3/g" node_modules/ffmpeg-kit-react-native/android/build.gradle || true
      - run: npx expo prebuild --platform android --clean --non-interactive
      - run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with: {name: APK, path: android/app/build/outputs/apk/release/app-release.apk}
